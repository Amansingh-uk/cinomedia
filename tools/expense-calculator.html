<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Expense Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: #0d0d0d;
  color: #fff;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.container {
  width: 100%;
  max-width: 900px;
}

h1 {
  margin-bottom: 20px;
  font-size: 28px;
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, select {
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  border: none;
  background: #f5a623;
  color: #000;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.expense-list {
  margin-top: 20px;
}

.expense-item {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #1a1a1a;
  border-radius: 6px;
  margin-bottom: 10px;
}

.total {
  font-size: 20px;
  margin-top: 15px;
}

.category-box {
  margin-top: 15px;
}

.category-box div {
  margin: 5px 0;
  font-size: 14px;
}

.delete-btn {
  background: red;
  color: white;
  padding: 5px 10px;
}
</style>
</head>

<body>

<div class="container">

  <h1>💸 Expense Calculator</h1>

  <!-- Input -->
  <div class="card">
    <input type="text" id="name" placeholder="Expense Name">
    <input type="number" id="amount" placeholder="Amount">
    
    <select id="category">
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Other</option>
    </select>

    <button onclick="addExpense()">Add</button>
  </div>

  <!-- List -->
  <div class="card">
    <h3>Expenses</h3>
    <div class="expense-list" id="list"></div>

    <div class="total">Total: ₹ <span id="total">0</span></div>

    <div class="category-box" id="categories"></div>
  </div>

</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function saveData() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}

function addExpense() {
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let category = document.getElementById("category").value;

  if (!name || !amount) {
    alert("Fill all fields");
    return;
  }

  expenses.push({
    id: Date.now(),
    name,
    amount: Number(amount),
    category
  });

  saveData();
  render();

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}

function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  saveData();
  render();
}

function render() {
  let list = document.getElementById("list");
  let total = 0;
  let categoryData = {};

  list.innerHTML = "";

  expenses.forEach(e => {
    total += e.amount;

    if (!categoryData[e.category]) {
      categoryData[e.category] = 0;
    }
    categoryData[e.category] += e.amount;

    list.innerHTML += `
      <div class="expense-item">
        <div>
          <strong>${e.name}</strong><br>
          ₹${e.amount} - ${e.category}
        </div>
        <button class="delete-btn" onclick="deleteExpense(${e.id})">X</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;

  // Category Breakdown
  let catBox = document.getElementById("categories");
  catBox.innerHTML = "<h4>Category Breakdown:</h4>";

  for (let cat in categoryData) {
    catBox.innerHTML += `<div>${cat}: ₹${categoryData[cat]}</div>`;
  }
}

render();
</script>

</body>
</html>
