<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Expense Calculator</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
  background: #888;
  color: white;
  padding: 15px;
}

.section {
  margin-top: 25px;
}

.grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: 2px solid #ff6b6b;
  width: 100%;
}

.label {
  background: #d99b4c;
  padding: 10px;
  font-weight: bold;
}

.total-box {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid #ffa94d;
  font-weight: bold;
}

button {
  background: green;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 25px;
  margin-top: 15px;
  cursor: pointer;
  width: 200px;
}

.result {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Expense Calculator</h1>

<!-- INCOME -->
<div class="section">
<div class="label">Income</div>
<div class="grid">
<input placeholder="Your Salary" id="salary">
<input type="number" value="0" id="salaryVal">

<input placeholder="Partner Salary">
<input type="number" value="0" id="partner">

<input placeholder="Other Income">
<input type="number" value="0" id="other">
</div>

<div class="total-box">Total Income: ₹ <span id="incomeTotal">0</span></div>
</div>

<!-- ESSENTIAL -->
<div class="section">
<div class="label">Essential Expenses</div>
<div class="grid">

<input placeholder="Groceries">
<input type="number" value="0" class="ess">

<input placeholder="Bills">
<input type="number" value="0" class="ess">

<input placeholder="EMI">
<input type="number" value="0" class="ess">

<input placeholder="Insurance">
<input type="number" value="0" class="ess">

</div>

<div class="total-box">Essential Total: ₹ <span id="essTotal">0</span></div>
</div>

<!-- NON ESSENTIAL -->
<div class="section">
<div class="label">Non Essential</div>
<div class="grid">

<input placeholder="Shopping">
<input type="number" value="0" class="non">

<input placeholder="Movies">
<input type="number" value="0" class="non">

<input placeholder="Eating Out">
<input type="number" value="0" class="non">

<input placeholder="Others">
<input type="number" value="0" class="non">

</div>

<div class="total-box">Non Essential Total: ₹ <span id="nonTotal">0</span></div>
</div>

<button onclick="calculate()">CALCULATE</button>

<!-- RESULT -->
<div class="result">

<div class="total-box">Your Income: ₹ <span id="resIncome">0</span></div>
<div class="total-box">Expenses: ₹ <span id="resExpense">0</span></div>

<div class="total-box">Savings: ₹ <span id="resSavings">0</span></div>
<div class="total-box">EMI: ₹ <span id="resEmi">0</span></div>

</div>

</div>

<script>
function sumClass(cls) {
  let total = 0;
  document.querySelectorAll("." + cls).forEach(el => {
    total += Number(el.value) || 0;
  });
  return total;
}

function calculate() {
  let salary = Number(document.getElementById("salaryVal").value);
  let partner = Number(document.getElementById("partner").value);
  let other = Number(document.getElementById("other").value);

  let income = salary + partner + other;

  let essential = sumClass("ess");
  let non = sumClass("non");

  let totalExpense = essential + non;
  let savings = income - totalExpense;

  document.getElementById("incomeTotal").innerText = income;
  document.getElementById("essTotal").innerText = essential;
  document.getElementById("nonTotal").innerText = non;

  document.getElementById("resIncome").innerText = income;
  document.getElementById("resExpense").innerText = totalExpense;
  document.getElementById("resSavings").innerText = savings;

  document.getElementById("resEmi").innerText =
    document.querySelectorAll(".ess")[2].value || 0;
}
</script>

</body>
</html>
